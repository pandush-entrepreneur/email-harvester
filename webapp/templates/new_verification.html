{% extends "base.html" %}{% block content %}<section class="page narrow"><a class="back" href="{{ url_for('verification_dashboard') }}">← Verification</a><div class="eyebrow">NEW VERIFICATION</div><h1>Upload a CSV</h1><p>We’ll detect the email column and place the job in the shared MailTester queue. The list name is optional.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="panel stack"><label>List name <span class="optional">Optional</span><input name="name" placeholder="Uses the filename if left blank"></label><label>CSV file<input type="file" name="file" accept=".csv,text/csv" required></label><button class="button" type="submit">Upload and verify</button></form></section>{% endblock %}
